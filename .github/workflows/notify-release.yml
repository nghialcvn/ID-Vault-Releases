name: Notify ID Vault release
on:
  workflow_run:
    workflows: [Publish verified ID Vault APK]
    types: [completed]
permissions:
  contents: read
  id-token: write
jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.FIREBASE_PROJECT_ID != '' &&
      vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.FIREBASE_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
          create_credentials_file: false
      - name: Send stable release signal
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FCM_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          project = os.environ['FIREBASE_PROJECT_ID']
          if not re.fullmatch(r'[a-z][a-z0-9-]{4,61}[a-z0-9]', project):
              raise ValueError('Invalid Firebase project ID')
          req = urllib.request.Request('https://api.github.com/repos/nghialcvn/ID-Vault-Releases/releases/latest', headers={'Accept':'application/vnd.github+json','User-Agent':'ID-Vault-release'})
          with urllib.request.urlopen(req, timeout=20) as r:
              release = json.load(r)
          tag = release['tag_name']
          if release['draft'] or release['prerelease'] or not re.fullmatch(r'v[0-9]+(?:\.[0-9]+){1,2}', tag):
              raise ValueError('Not a stable release')
          assets = [a for a in release['assets'] if a['name'] == f'id-vault-{tag}.apk' and a['state']=='uploaded']
          if len(assets)!=1 or not re.fullmatch(r'sha256:[0-9a-f]{64}', assets[0].get('digest','')):
              raise ValueError('Release APK is missing or unverified')
          payload = {'message':{'topic':'idvault-updates','data':{'type':'idvault-release','tag':tag},'android':{'priority':'HIGH','ttl':'86400s','collapse_key':'idvault-release','restricted_package_name':'com.idvault.app'}}}
          request = urllib.request.Request(f'https://fcm.googleapis.com/v1/projects/{project}/messages:send', data=json.dumps(payload).encode(), headers={'Authorization':'Bearer '+os.environ['FCM_ACCESS_TOKEN'],'Content-Type':'application/json'})
          with urllib.request.urlopen(request, timeout=20) as r:
              response = json.load(r)
          if not response.get('name'): raise ValueError('FCM did not accept the release signal')
          print('FCM accepted the release signal. Device delivery must be verified separately.')
          PY
